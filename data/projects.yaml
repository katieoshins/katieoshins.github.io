items:
  - title: "How are positive and negative associations learned and modified across age?"
    summary: "We found that learned associations peak and are most persistent in late adolescents. This peak paralleled a growing tendency to treat the change in reinforcement as a new situation instead of rewriting what was previously learned."
    image: "/images/projects/valenced_learning.jpg"
    links:
      - label: "preprint"
        url: "https://osf.io/preprints/psyarxiv/52w7j_v1"

  - title: "How does unexpected social feedback shape behavior?"
    summary: "We investigate age-related differences in the neural correlates of social prediction errors, and how these neural responses relate to subsequent learning and memory."
    image: "/images/projects/soca_mri.jpg"
    links:
      - label: "poster"
        url: "https://drive.google.com/file/d/1RlNFq0AKFxY4tE0ii0VEterq_jA31PkZ/view?usp=sharing"

  - title: "How do daily emotional patterns shape adolescent mental health?"
    summary: "We examine how emotions fluctuate, persist, and influence one another in daily life, and how these patterns relate to internalizing sympyoms in adolescence."
    image: "/images/projects/affect_dynamics.jpg"
    links:
      - label: "poster"
        url: "https://drive.google.com/file/d/1YzEosiGKQ2BJWcLpWp74h3Z7FOd9SjY6/view?usp=sharing"


